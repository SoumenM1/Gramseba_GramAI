services:

  gramai:
    build:
      context: .
      dockerfile: docker/Dockerfile

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - mongodb
      - redis
      - qdrant

  mongodb:
    image: mongo:7

    restart: unless-stopped

    ports:
      - "27017:27017"

    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7-alpine

    restart: unless-stopped

    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant

    restart: unless-stopped

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - qdrant_data:/qdrant/storage

volumes:

  mongodb_data:

  qdrant_data: